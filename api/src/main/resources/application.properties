spring.application.name=todo-api

# Settings (sdd.md section 11), all read from the environment with safe local defaults:
#   TODO_DB_PATH        SQLite file, default ./data/todo.db (todo.db.path)
#   TODO_COOKIE_SECURE  true only behind HTTPS, default false (todo.cookie.secure)
#   SERVER_PORT         default 8080 (server.port)

# Errors are Problem documents written by app.todo.common.ProblemErrorController, never Boot's default page
server.error.whitelabel.enabled=false

# Structured (JSON) logs; the request id travels in the logging context (sdd.md section 10)
logging.structured.format.console=logstash

spring.flyway.locations=classpath:db/migration
