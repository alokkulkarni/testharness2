openapi: 3.1.0
info:
  title: To-do API — to-dos module
  version: 1.0.0
  description: |
    To-dos module of the CHG-0001 To-do API (NFR-007 AC-3; Source: clarifications Q51, Q56, Q57): the to-do and list
    operations of the signed-in caller. Served by package `app.todo.todo` of the one Spring Boot application
    (sdd.md §2, adr/0018). Sign-up, login, logout and the session are in `identity-api-v1.yaml`; every operation
    belongs to exactly one of the two files. See docs/specs/CHG-0001/sdd.md for behaviour and
    docs/specs/CHG-0001/requirements.md for the requirement IDs cited in each operation.

    The shared error body (`Problem`, `FieldError`), the shared error responses, the `X-Todo-Client` header and the
    session cookie are defined in `common-problem-v1.yaml` and referenced here by `$ref`. The conventions in that
    file's `info.description` (content type, error bodies for every path under `/api/`, characters, whitespace,
    trimming, unknown properties, the session cookie, the `X-Todo-Client` header, the order of checks and unknown
    query parameters) apply to every operation of this file. The three files change together and carry the same
    `info.version`.
servers:
  - url: http://localhost:8080
    description: API process, local run (NFR-002)
  - url: http://localhost:5173
    description: Vite dev server, which proxies /api to the API process (same origin for the SPA)
security:
  - sessionCookie: []
tags:
  - name: todos
paths:
  /api/v1/todos:
    get:
      tags: [todos]
      operationId: listTodos
      summary: List the caller's to-dos (REQ-TODO-003, REQ-LIST-001..003, REQ-ISO-001 AC-1, AC-4)
      description: |
        Returns only the caller's to-dos, ordered newest first by `createdAt`, ties broken by insertion order
        (newest first), 20 per page. `status` and `q` combine (AND). A `page` beyond the last page returns the last
        page and reports it in `page` (REQ-LIST-003 AC-6); when nothing matches, `page` is 1 and `items` is empty.
        `totals` counts all of the caller's to-dos regardless of `status`, `q` and `page`.
      parameters:
        - name: status
          in: query
          required: false
          description: Filter (REQ-LIST-001). Default `all` (AC-5). Any other value is refused with 400.
          schema:
            type: string
            enum: [all, active, completed]
            default: all
        - name: q
          in: query
          required: false
          description: |
            Search text (REQ-LIST-002). Trimmed; empty after trimming means no search restriction (AC-5, AC-7).
            Matches a to-do whose title or description contains the text, case-insensitively, with every
            character (including `%`, `_`, `\`, quotes) matched literally (AC-1, AC-2, AC-6).
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: |
            1-based page number (REQ-LIST-003). Default 1. A decimal integer of any size greater than zero is
            accepted; zero, a negative number or anything that is not a decimal integer is refused with 400
            `VALIDATION_FAILED`, field `page` (AC-7). A value beyond the last page, however large, returns the last
            page (AC-6).
          schema:
            type: string
            pattern: '^0*[1-9][0-9]*$'
            default: '1'
      responses:
        '200':
          description: One page of the caller's to-dos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoPage'
        '400':
          $ref: './common-problem-v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common-problem-v1.yaml#/components/responses/Unauthenticated'
        '500':
          $ref: './common-problem-v1.yaml#/components/responses/InternalError'
    post:
      tags: [todos]
      operationId: createTodo
      summary: Create a to-do (REQ-TODO-001, REQ-TODO-002)
      description: |
        Creates a to-do owned by the caller, not done, with `createdAt` = `updatedAt` = now. An omitted or null
        `priority` is stored as `MEDIUM` (REQ-TODO-001 AC-2).
      parameters:
        - $ref: './common-problem-v1.yaml#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreate'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: /api/v1/todos/{todoId} of the new to-do.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: './common-problem-v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common-problem-v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common-problem-v1.yaml#/components/responses/ClientHeaderMissing'
        '415':
          $ref: './common-problem-v1.yaml#/components/responses/UnsupportedMediaType'
        '500':
          $ref: './common-problem-v1.yaml#/components/responses/InternalError'
  /api/v1/todos/completed:
    delete:
      tags: [todos]
      operationId: clearCompletedTodos
      summary: Delete all of the caller's completed to-dos (REQ-TODO-007, REQ-ISO-001 AC-3)
      description: |
        Permanently deletes every completed to-do of the caller, regardless of any filter, search or page; active
        to-dos and other users' to-dos are untouched. When the caller has no completed to-dos the result is
        200 with `deletedCount` 0 (the UI disables the control in that case, REQ-TODO-007 AC-4).
      parameters:
        - $ref: './common-problem-v1.yaml#/components/parameters/ClientHeader'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearCompletedResult'
        '401':
          $ref: './common-problem-v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common-problem-v1.yaml#/components/responses/ClientHeaderMissing'
        '500':
          $ref: './common-problem-v1.yaml#/components/responses/InternalError'
  /api/v1/todos/{todoId}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      tags: [todos]
      operationId: getTodo
      summary: Read one of the caller's to-dos (REQ-TODO-003 AC-3, REQ-ISO-001 AC-2)
      responses:
        '200':
          description: The to-do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          $ref: './common-problem-v1.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: './common-problem-v1.yaml#/components/responses/NotFound'
        '500':
          $ref: './common-problem-v1.yaml#/components/responses/InternalError'
    put:
      tags: [todos]
      operationId: updateTodo
      summary: Replace a to-do's content fields (REQ-TODO-004, REQ-DATA-002)
      description: |
        Whole-record replace of the content fields `title`, `description`, `dueDate` and `priority`; `done` is not
        changed here (use PUT /api/v1/todos/{todoId}/done). Last write wins: no version check (REQ-DATA-002).
        An absent, null, empty or whitespace-only `description` stores no description (REQ-TODO-004 AC-4).
        `priority` is required. `updatedAt` advances; `createdAt` is unchanged. Never creates a to-do
        (REQ-TODO-004 AC-3).
      parameters:
        - $ref: './common-problem-v1.yaml#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: './common-problem-v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common-problem-v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common-problem-v1.yaml#/components/responses/ClientHeaderMissing'
        '404':
          $ref: './common-problem-v1.yaml#/components/responses/NotFound'
        '415':
          $ref: './common-problem-v1.yaml#/components/responses/UnsupportedMediaType'
        '500':
          $ref: './common-problem-v1.yaml#/components/responses/InternalError'
    delete:
      tags: [todos]
      operationId: deleteTodo
      summary: Permanently delete one of the caller's to-dos (REQ-TODO-006)
      parameters:
        - $ref: './common-problem-v1.yaml#/components/parameters/ClientHeader'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: './common-problem-v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common-problem-v1.yaml#/components/responses/ClientHeaderMissing'
        '404':
          $ref: './common-problem-v1.yaml#/components/responses/NotFound'
        '500':
          $ref: './common-problem-v1.yaml#/components/responses/InternalError'
  /api/v1/todos/{todoId}/done:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    put:
      tags: [todos]
      operationId: setTodoDone
      summary: Mark a to-do done or not done (REQ-TODO-005)
      description: |
        Sets `done` to the given value (idempotent). `updatedAt` advances on every accepted request; the content
        fields are unchanged. Last write wins (REQ-DATA-002).
      parameters:
        - $ref: './common-problem-v1.yaml#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoDoneUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: './common-problem-v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common-problem-v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common-problem-v1.yaml#/components/responses/ClientHeaderMissing'
        '404':
          $ref: './common-problem-v1.yaml#/components/responses/NotFound'
        '415':
          $ref: './common-problem-v1.yaml#/components/responses/UnsupportedMediaType'
        '500':
          $ref: './common-problem-v1.yaml#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      $ref: './common-problem-v1.yaml#/components/securitySchemes/sessionCookie'
  parameters:
    TodoId:
      name: todoId
      in: path
      required: true
      description: |
        The to-do's public identifier (a UUID). A value that is not a UUID, that does not exist, or that belongs to
        another user returns the same 404 `NOT_FOUND` (REQ-ISO-001 AC-2).
      schema:
        type: string
  schemas:
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
      description: Shown in the UI as Low, Medium, High (REQ-TODO-002 AC-8). Any other value is refused with 400.
    DueDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: |
        Calendar date `YYYY-MM-DD` with no time or zone (REQ-TODO-002 AC-7). Must be a real date in the ISO
        calendar, year 0001 to 9999 (AC-6); past dates are accepted (AC-9).
    TodoCreate:
      type: object
      additionalProperties: false
      required: [title, dueDate]
      properties:
        title:
          type: string
          description: Trimmed; the trimmed title must be 1 to 200 characters (REQ-TODO-002 AC-1..AC-3).
        description:
          type: [string, 'null']
          maxLength: 2000
          description: |
            Optional, up to 2000 characters as sent (REQ-TODO-002 AC-4). Absent, null, empty or whitespace-only
            stores no description (REQ-TODO-001 AC-3). Otherwise stored exactly as sent (not trimmed).
        dueDate:
          $ref: '#/components/schemas/DueDate'
        priority:
          description: Optional; absent or null stores MEDIUM (REQ-TODO-001 AC-2).
          oneOf:
            - $ref: '#/components/schemas/Priority'
            - type: 'null'
    TodoUpdate:
      type: object
      additionalProperties: false
      required: [title, dueDate, priority]
      properties:
        title:
          type: string
          description: Same rule as TodoCreate.title.
        description:
          type: [string, 'null']
          maxLength: 2000
          description: Same rule as TodoCreate.description; absent, null, empty or whitespace-only clears it (REQ-TODO-004 AC-4).
        dueDate:
          $ref: '#/components/schemas/DueDate'
        priority:
          $ref: '#/components/schemas/Priority'
    TodoDoneUpdate:
      type: object
      additionalProperties: false
      required: [done]
      properties:
        done:
          type: boolean
    Todo:
      type: object
      additionalProperties: false
      required: [id, title, description, dueDate, priority, done, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        dueDate:
          $ref: '#/components/schemas/DueDate'
        priority:
          $ref: '#/components/schemas/Priority'
        done:
          type: boolean
          description: true = Completed, false = Active.
        createdAt:
          type: string
          format: date-time
          description: UTC, millisecond precision, e.g. 2026-11-06T10:15:30.123Z.
        updatedAt:
          type: string
          format: date-time
          description: UTC, millisecond precision; strictly later after every accepted write.
    TodoPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, totalItems, totalPages, totals]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Todo'
        page:
          type: integer
          minimum: 1
          description: The page actually returned (the last page when a larger one was requested).
        pageSize:
          type: integer
          const: 20
        totalItems:
          type: integer
          minimum: 0
          description: Number of the caller's to-dos matching `status` and `q`.
        totalPages:
          type: integer
          minimum: 0
          description: ceil(totalItems / 20); 0 when nothing matches.
        totals:
          $ref: '#/components/schemas/TodoTotals'
    TodoTotals:
      type: object
      additionalProperties: false
      required: [all, active, completed]
      description: |
        Counts of all of the caller's to-dos, ignoring `status`, `q` and `page`. `all` = 0 selects the first-use
        empty state (REQ-TODO-003 AC-2); `completed` is the count in the clear-completed confirmation and disables
        that control when 0 (REQ-TODO-007 AC-1, AC-4).
      properties:
        all:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
    ClearCompletedResult:
      type: object
      additionalProperties: false
      required: [deletedCount]
      properties:
        deletedCount:
          type: integer
          minimum: 0
