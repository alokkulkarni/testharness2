openapi: 3.1.0
info:
  title: To-do API
  version: 1.0.0
  description: |
    HTTP API for CHG-0001 (to-do list). Source of truth for every interface between the React SPA and the
    Spring Boot API; see docs/specs/CHG-0001/sdd.md for behaviour and docs/specs/CHG-0001/requirements.md for the
    requirement IDs cited in each operation.

    Conventions (sdd.md "Validation" and "Error model"):
    - Request and response bodies are JSON (`application/json`); errors are RFC 9457 problem details
      (`application/problem+json`, schema `Problem`).
    - "Characters" in every length limit means Unicode code points, on server and client alike.
    - Where a field is trimmed before it is checked (identifier, title), the limit applies to the trimmed value
      and is stated in the field description; no raw `maxLength` is declared for such fields.
    - Request bodies accept only the properties listed (`additionalProperties: false`); an unknown property is
      refused with 400 `VALIDATION_FAILED` (field error code `UNKNOWN_FIELD`).
    - Authentication is an opaque session cookie (`todo_session`) set by login; the session lasts 8 hours from
      login (absolute, not extended by activity).
    - Every POST, PUT and DELETE request must carry the header `X-Todo-Client: web`. On operations that require a
      session, the session is checked first (401), then the header (403).
    - Unknown query parameters are ignored (there is no page-size parameter; the page size is fixed at 20).
servers:
  - url: http://localhost:8080
    description: API process, local run (NFR-002)
  - url: http://localhost:5173
    description: Vite dev server, which proxies /api to the API process (same origin for the SPA)
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: todos
paths:
  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: Create an account (REQ-AUTH-001)
      description: |
        Creates an account and does not start a session; the client then logs in (REQ-AUTH-001 AC-1).
        The identifier is trimmed; it is unique regardless of letter case (AC-6). No email verification (AC-4).
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ClientHeaderMissing'
        '409':
          description: |
            The identifier is already in use, compared case-insensitively (REQ-AUTH-001 AC-2, AC-6).
            `code` is `IDENTIFIER_TAKEN` and `errors` holds one entry with field `identifier` and code `TAKEN`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: logIn
      summary: Log in and start a session (REQ-AUTH-002)
      description: |
        The identifier is trimmed and compared case-insensitively, exactly as at sign-up (REQ-AUTH-002 AC-5).
        No format rule is applied at login: an unknown identifier, a wrong password, or a password over 128
        characters all return the same 401 `INVALID_CREDENTIALS` body (REQ-AUTH-002 AC-2, AC-3).
        An empty identifier (after trimming) or an empty password is refused with 400 `VALIDATION_FAILED`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: |
                `todo_session=<opaque token>; Path=/; HttpOnly; SameSite=Strict; Max-Age=28800`, plus `Secure`
                when the API is configured for HTTPS (sdd.md "Local run").
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Wrong password or unknown identifier; the body is identical in both cases (REQ-AUTH-002 AC-2, AC-3).
            `code` is `INVALID_CREDENTIALS`; `detail` is "Invalid identifier or password."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/ClientHeaderMissing'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logOut
      summary: End the current session (REQ-AUTH-004 AC-3)
      description: |
        Deletes the server-side session named by the cookie, if any, and clears the cookie. Always 204, also when
        there is no session or it has already expired.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '204':
          description: Session ended (or there was none).
          headers:
            Set-Cookie:
              description: '`todo_session=; Path=/; HttpOnly; SameSite=Strict; Max-Age=0`'
              schema:
                type: string
        '403':
          $ref: '#/components/responses/ClientHeaderMissing'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The current session, used by the SPA on load (REQ-AUTH-002 AC-4, REQ-AUTH-004 AC-2, AC-4)
      responses:
        '200':
          description: A valid, unexpired session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/todos:
    get:
      tags: [todos]
      operationId: listTodos
      summary: List the caller's to-dos (REQ-TODO-003, REQ-LIST-001..003, REQ-ISO-001 AC-1, AC-4)
      description: |
        Returns only the caller's to-dos, ordered newest first by `createdAt`, ties broken by insertion order
        (newest first), 20 per page. `status` and `q` combine (AND). A `page` beyond the last page returns the last
        page and reports it in `page` (REQ-LIST-003 AC-6); when nothing matches, `page` is 1 and `items` is empty.
        `totals` counts all of the caller's to-dos regardless of `status`, `q` and `page`.
      parameters:
        - name: status
          in: query
          required: false
          description: Filter (REQ-LIST-001). Default `all` (AC-5). Any other value is refused with 400.
          schema:
            type: string
            enum: [all, active, completed]
            default: all
        - name: q
          in: query
          required: false
          description: |
            Search text (REQ-LIST-002). Trimmed; empty after trimming means no search restriction (AC-5, AC-7).
            Matches a to-do whose title or description contains the text, case-insensitively, with every
            character (including `%`, `_`, `\`, quotes) matched literally (AC-1, AC-2, AC-6).
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: |
            1-based page number (REQ-LIST-003). Default 1. A decimal integer of any size greater than zero is
            accepted; zero, a negative number or anything that is not a decimal integer is refused with 400
            `VALIDATION_FAILED`, field `page` (AC-7). A value beyond the last page, however large, returns the last
            page (AC-6).
          schema:
            type: string
            pattern: '^0*[1-9][0-9]*$'
            default: '1'
      responses:
        '200':
          description: One page of the caller's to-dos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [todos]
      operationId: createTodo
      summary: Create a to-do (REQ-TODO-001, REQ-TODO-002)
      description: |
        Creates a to-do owned by the caller, not done, with `createdAt` = `updatedAt` = now. An omitted or null
        `priority` is stored as `MEDIUM` (REQ-TODO-001 AC-2).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreate'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: /api/v1/todos/{todoId} of the new to-do.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ClientHeaderMissing'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/todos/completed:
    delete:
      tags: [todos]
      operationId: clearCompletedTodos
      summary: Delete all of the caller's completed to-dos (REQ-TODO-007, REQ-ISO-001 AC-3)
      description: |
        Permanently deletes every completed to-do of the caller, regardless of any filter, search or page; active
        to-dos and other users' to-dos are untouched. When the caller has no completed to-dos the result is
        200 with `deletedCount` 0 (the UI disables the control in that case, REQ-TODO-007 AC-4).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearCompletedResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ClientHeaderMissing'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/todos/{todoId}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      tags: [todos]
      operationId: getTodo
      summary: Read one of the caller's to-dos (REQ-TODO-003 AC-3, REQ-ISO-001 AC-2)
      responses:
        '200':
          description: The to-do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [todos]
      operationId: updateTodo
      summary: Replace a to-do's content fields (REQ-TODO-004, REQ-DATA-002)
      description: |
        Whole-record replace of the content fields `title`, `description`, `dueDate` and `priority`; `done` is not
        changed here (use PUT /api/v1/todos/{todoId}/done). Last write wins: no version check (REQ-DATA-002).
        An absent, null, empty or whitespace-only `description` stores no description (REQ-TODO-004 AC-4).
        `priority` is required. `updatedAt` advances; `createdAt` is unchanged. Never creates a to-do
        (REQ-TODO-004 AC-3).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ClientHeaderMissing'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [todos]
      operationId: deleteTodo
      summary: Permanently delete one of the caller's to-dos (REQ-TODO-006)
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ClientHeaderMissing'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/todos/{todoId}/done:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    put:
      tags: [todos]
      operationId: setTodoDone
      summary: Mark a to-do done or not done (REQ-TODO-005)
      description: |
        Sets `done` to the given value (idempotent). `updatedAt` advances on every accepted request; the content
        fields are unchanged. Last write wins (REQ-DATA-002).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoDoneUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ClientHeaderMissing'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: todo_session
      description: |
        Opaque random session token issued by login; valid for 8 hours from login (absolute) or until logout.
  parameters:
    TodoId:
      name: todoId
      in: path
      required: true
      description: |
        The to-do's public identifier (a UUID). A value that is not a UUID, that does not exist, or that belongs to
        another user returns the same 404 `NOT_FOUND` (REQ-ISO-001 AC-2).
      schema:
        type: string
    ClientHeader:
      name: X-Todo-Client
      in: header
      required: true
      description: |
        Must be exactly `web` on every POST, PUT and DELETE. Missing or different: 403 `CLIENT_HEADER_MISSING`
        (cross-site request defence, sdd.md "Auth and session").
      schema:
        type: string
        const: web
  responses:
    BadRequest:
      description: |
        `code` is `VALIDATION_FAILED` (one or more field errors in `errors`, each naming the field; REQ-TODO-002
        AC-10, REQ-AUTH-001 AC-3) or `MALFORMED_REQUEST` (the body is not parseable JSON; `errors` is empty).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: |
        No session cookie, an unknown or logged-out session, or an expired session (REQ-AUTH-004 AC-1, AC-3, AC-4).
        `code` is `UNAUTHENTICATED`. No data is returned or changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ClientHeaderMissing:
      description: The `X-Todo-Client` header is missing or wrong. `code` is `CLIENT_HEADER_MISSING`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        No to-do with this identifier is owned by the caller: it does not exist, was deleted, or belongs to another
        user. The body is identical in every case (REQ-ISO-001 AC-2, REQ-TODO-004 AC-3, REQ-TODO-006 AC-4).
        `code` is `NOT_FOUND`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: |
        Unexpected failure. `code` is `INTERNAL_ERROR`; `detail` is a fixed generic sentence. Never contains a
        stack trace, SQL, exception text, password or password hash (NFR-004 AC-2, REQ-AUTH-003 AC-3).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SignupRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: |
            Email address or username (REQ-AUTH-001 AC-7). Leading and trailing whitespace is removed; the trimmed
            value must be 3 to 254 characters (AC-8). Contains "@": must satisfy the email rule in sdd.md
            "Validation" (AC-9). No "@": only A-Z, a-z, 0-9, ".", "_", "-" (AC-10).
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            8 to 128 characters (REQ-AUTH-001 AC-5, AC-11). Not trimmed or normalised; stored only as an Argon2id
            hash (REQ-AUTH-003).
    SignupResult:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Trimmed, then compared case-insensitively with stored identifiers. Must not be empty after trimming.
        password:
          type: string
          minLength: 1
          description: Not trimmed. Must not be empty.
    User:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          description: The identifier as stored at sign-up (trimmed, original letter case).
    Session:
      type: object
      additionalProperties: false
      required: [user, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        expiresAt:
          type: string
          format: date-time
          description: UTC instant when the session ends (login time + 8 hours).
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
      description: Shown in the UI as Low, Medium, High (REQ-TODO-002 AC-8). Any other value is refused with 400.
    DueDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: |
        Calendar date `YYYY-MM-DD` with no time or zone (REQ-TODO-002 AC-7). Must be a real date in the ISO
        calendar, year 0001 to 9999 (AC-6); past dates are accepted (AC-9).
    TodoCreate:
      type: object
      additionalProperties: false
      required: [title, dueDate]
      properties:
        title:
          type: string
          description: Trimmed; the trimmed title must be 1 to 200 characters (REQ-TODO-002 AC-1..AC-3).
        description:
          type: [string, 'null']
          maxLength: 2000
          description: |
            Optional, up to 2000 characters as sent (REQ-TODO-002 AC-4). Absent, null, empty or whitespace-only
            stores no description (REQ-TODO-001 AC-3). Otherwise stored exactly as sent (not trimmed).
        dueDate:
          $ref: '#/components/schemas/DueDate'
        priority:
          description: Optional; absent or null stores MEDIUM (REQ-TODO-001 AC-2).
          oneOf:
            - $ref: '#/components/schemas/Priority'
            - type: 'null'
    TodoUpdate:
      type: object
      additionalProperties: false
      required: [title, dueDate, priority]
      properties:
        title:
          type: string
          description: Same rule as TodoCreate.title.
        description:
          type: [string, 'null']
          maxLength: 2000
          description: Same rule as TodoCreate.description; absent, null, empty or whitespace-only clears it (REQ-TODO-004 AC-4).
        dueDate:
          $ref: '#/components/schemas/DueDate'
        priority:
          $ref: '#/components/schemas/Priority'
    TodoDoneUpdate:
      type: object
      additionalProperties: false
      required: [done]
      properties:
        done:
          type: boolean
    Todo:
      type: object
      additionalProperties: false
      required: [id, title, description, dueDate, priority, done, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        dueDate:
          $ref: '#/components/schemas/DueDate'
        priority:
          $ref: '#/components/schemas/Priority'
        done:
          type: boolean
          description: true = Completed, false = Active.
        createdAt:
          type: string
          format: date-time
          description: UTC, millisecond precision, e.g. 2026-11-06T10:15:30.123Z.
        updatedAt:
          type: string
          format: date-time
          description: UTC, millisecond precision; strictly later after every accepted write.
    TodoPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, totalItems, totalPages, totals]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Todo'
        page:
          type: integer
          minimum: 1
          description: The page actually returned (the last page when a larger one was requested).
        pageSize:
          type: integer
          const: 20
        totalItems:
          type: integer
          minimum: 0
          description: Number of the caller's to-dos matching `status` and `q`.
        totalPages:
          type: integer
          minimum: 0
          description: ceil(totalItems / 20); 0 when nothing matches.
        totals:
          $ref: '#/components/schemas/TodoTotals'
    TodoTotals:
      type: object
      additionalProperties: false
      required: [all, active, completed]
      description: |
        Counts of all of the caller's to-dos, ignoring `status`, `q` and `page`. `all` = 0 selects the first-use
        empty state (REQ-TODO-003 AC-2); `completed` is the count in the clear-completed confirmation and disables
        that control when 0 (REQ-TODO-007 AC-1, AC-4).
      properties:
        all:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
    ClearCompletedResult:
      type: object
      additionalProperties: false
      required: [deletedCount]
      properties:
        deletedCount:
          type: integer
          minimum: 0
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code, errors]
      properties:
        type:
          type: string
          description: '`urn:todo:problem:` followed by `code` in lower kebab case, e.g. urn:todo:problem:validation-failed.'
        title:
          type: string
          description: Short fixed summary for the code.
        status:
          type: integer
        detail:
          type: string
          description: Human-readable, safe to show; never contains internals.
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - MALFORMED_REQUEST
            - IDENTIFIER_TAKEN
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - CLIENT_HEADER_MISSING
            - NOT_FOUND
            - INTERNAL_ERROR
        errors:
          type: array
          description: Field errors; empty unless `code` is VALIDATION_FAILED or IDENTIFIER_TAKEN.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The request property or query parameter, e.g. title, dueDate, identifier, page.
        code:
          type: string
          enum:
            - REQUIRED
            - BLANK
            - TOO_SHORT
            - TOO_LONG
            - INVALID_FORMAT
            - INVALID_TYPE
            - INVALID_DATE
            - INVALID_VALUE
            - UNKNOWN_FIELD
            - TAKEN
        message:
          type: string
          description: Human-readable message naming the problem, shown next to the field (NFR-001 AC-3).
