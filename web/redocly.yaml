# Contract tooling for web/ (ADR-0001, ADR-0012; sdd.md §2, §12.1 item 17).
# `redocly lint` lints the two module roots; common-problem-v1.yaml is linted through their $refs.
# `openapi-typescript` generates one types file per module (`pnpm gen:api`); its options are CLI flags
# (the x-openapi-ts key only carries `output`), set in the package.json script.
extends:
  - recommended

apis:
  identity:
    root: ../docs/specs/CHG-0001/contracts/identity-api-v1.yaml
    x-openapi-ts:
      output: src/api/identity.ts
  todos:
    root: ../docs/specs/CHG-0001/contracts/todo-api-v1.yaml
    x-openapi-ts:
      output: src/api/todos.ts
